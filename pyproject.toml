[project]
name = "photo-organizer"
version = "0.1.0"
description = "Sort photos into YEAR/MONTH/YYYY-MM-DD with SQLite tracking, plus Gemma 4 + InsightFace analysis"
# mlx-vlm wheels are 3.11-only on this stack.
requires-python = ">=3.11,<3.12"
dependencies = [
    "humanize>=4.15.0",
    # Reads the Apple Photos library (photos:YYYY queue sources); 0.69 can't read macOS 27 libraries.
    "osxphotos>=0.77",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "Pillow>=10.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
analysis = [
    # >=0.5 required for gemma4 model_type support.
    "mlx-vlm>=0.5",
    "insightface",
    # Mainline has Apple Silicon + CoreML since 1.17; do not use onnxruntime-silicon (NumPy 2 segfaults).
    "onnxruntime>=1.17",
    "opencv-python",
    "scikit-learn>=1.8.0",
    "pillow-heif>=1.3.0",
    "fastapi",
    "uvicorn",
    "datasette>=0.65.2",
    "datasette-cluster-map>=0.18.2",
]

[project.scripts]
photo-organizer = "photo_organizer.cli:main"
photo-organizer-status = "photo_organizer.status:main"
photo-organizer-verify = "photo_organizer.verify:main"
photo-organizer-queue = "photo_organizer.work_queue:main"
photo-organizer-cameras = "photo_organizer.cameras:main"
photo-organizer-locations = "photo_organizer.locations:main"
photo-analyze = "photo_organizer.analysis.analyze:main"
photo-cluster-faces = "photo_organizer.analysis.cluster:main"
photo-enrich = "photo_organizer.analysis.enrich:main"
photo-index = "photo_organizer.analysis.index:main"
photo-face-browser = "photo_organizer.analysis.face_browser:main"
photo-ark-analyze = "photo_organizer.analysis.ark:main"
photo-day-browser = "photo_organizer.analysis.day_browser:main"
photo-ark-timelapse = "photo_organizer.analysis.timelapse:main"
photo-ark-screenshots = "photo_organizer.analysis.screenshots:main"
photo-shuffle = "photo_organizer.analysis.shuffle:main"
photo-ui = "photo_organizer.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_organizer"]
